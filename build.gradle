plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.CENTURYCLOUD'

// Permite a JitPack o Gradle pasar la versión dinámicamente si existe, o usar un fallback
version = project.hasProperty('version') && project.version != 'unspecified' ? project.version : '2025.09.26'

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.github.CENTURYCLOUD'
            artifactId = 'device-libs-desktop'
            
            artifact("libs/ReaderAPI20250926.jar")
        }
    }
}
