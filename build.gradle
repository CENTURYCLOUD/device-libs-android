plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.CENTURYCLOUD'
// Asegurar que exista una versión por defecto si no se pasa por parámetro
version = project.hasProperty('version') && project.property('version') != 'unspecified' ? project.property('version') : '1.0.0'

task customJar(type: Jar) {
    archiveBaseName = 'device-libs-desktop'
    from zipTree(file("libs/ReaderAPI20250926.jar"))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = 'device-libs-desktop'
            version = project.version // Utiliza la versión definida arriba
            
            artifact(customJar)
        }
    }
}
